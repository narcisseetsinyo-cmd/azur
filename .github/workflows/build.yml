name: Fabriquer les installateurs

on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Mettre les installateurs en ligne sur la page de téléchargement protégée"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Azur pour ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmd: npm run dist:win
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
          - name: Mac
            os: macos-latest
            cmd: npm run dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Tester la base de données
        run: |
          npm rebuild better-sqlite3
          npm test

      - name: Préparer l'interface et son manifeste
        run: node scripts/build-web.js

      - name: Fabriquer l'installateur
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.cmd }} -- --publish never 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Résumer l'erreur
        if: failure()
        shell: bash
        run: |
          msg=$(grep -v '^\s*$' build.log | tail -n 45 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Fabrication ${{ matrix.name }}::${msg}"

      - name: Mettre l'installateur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Azur-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 1


  proteger:
    name: Mettre en ligne les installateurs protégés
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publier
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Chiffrer avec le mot de passe de téléchargement
        run: node scripts/encrypt-downloads.js out enc
        env:
          DOWNLOAD_PASSWORD: ${{ secrets.DOWNLOAD_PASSWORD }}
      - name: Déposer les fichiers chiffrés
        run: |
          gh release delete installateurs-chiffres --yes --cleanup-tag || true
          gh release create installateurs-chiffres enc/* --prerelease --target "${{ github.sha }}" \
            --title "Installateurs chiffrés" \
            --notes "Fichiers chiffrés utilisés par la page de téléchargement protégée par mot de passe. Illisibles sans le mot de passe."
      - name: Effacer les installateurs en clair des artefacts
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate -q '.artifacts[] | select(.name | startswith("Azur-")) | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
      - name: Republier la version web avec les nouveaux installateurs
        run: gh workflow run web.yml --ref main
