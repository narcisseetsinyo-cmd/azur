name: Fabriquer les installateurs

on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier une version officielle (page Releases)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Azur pour ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmd: npm run dist:win
            files: dist/*.exe
          - name: Mac
            os: macos-latest
            cmd: npm run dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Tester la base de données
        run: |
          npm rebuild better-sqlite3
          npm test

      - name: Fabriquer l'installateur
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.cmd }} -- --publish never 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Résumer l'erreur
        if: failure()
        shell: bash
        run: |
          msg=$(grep -v '^\s*$' build.log | tail -n 45 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Fabrication ${{ matrix.name }}::${msg}"

      - name: Mettre l'installateur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Azur-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error


  release:
    name: Publier la version
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.publier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Azur ${{ steps.v.outputs.version }}
          body: |
            Azur, ton budget mensuel personnel, pour Windows et Mac.

            - **Windows** : `Azur-Setup-${{ steps.v.outputs.version }}.exe`
            - **Mac M1, M2, M3, M4** : `Azur-${{ steps.v.outputs.version }}-arm64.dmg`
            - **Mac Intel** : `Azur-${{ steps.v.outputs.version }}-x64.dmg`

            Au premier lancement, Windows ou macOS peut afficher un avertissement car le logiciel n'est pas encore signé. Voir le guide dans le README.
          files: out/*
