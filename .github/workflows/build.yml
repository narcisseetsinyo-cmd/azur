name: Fabriquer les installateurs

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Azur pour ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmd: npm run dist:win
            files: dist/*.exe
          - name: Mac
            os: macos-latest
            cmd: npm run dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Tester la base de données
        run: |
          npm rebuild better-sqlite3
          npm test

      - name: Fabriquer l'installateur
        run: ${{ matrix.cmd }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Mettre l'installateur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Azur-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
