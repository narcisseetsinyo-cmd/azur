name: Fabriquer les installateurs

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Azur pour ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmd: npm run dist:win
            files: dist/*.exe
          - name: Mac
            os: macos-latest
            cmd: npm run dist:mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Tester la base de données
        run: |
          npm rebuild better-sqlite3
          npm test

      - name: Fabriquer l'installateur
        shell: bash
        run: |
          set -o pipefail
          ${{ matrix.cmd }} -- --publish never 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Résumer l'erreur
        if: failure()
        shell: bash
        run: |
          msg=$(grep -v '^\s*$' build.log | tail -n 45 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Fabrication ${{ matrix.name }}::${msg}"

      - name: Mettre l'installateur à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Azur-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
